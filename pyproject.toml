[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonobelief"
version = "1.0.0"
description = "Anatomical belief for gallbladder ultrasound acquisition from GB-blind liver sweeps (simulation study)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy",
    "scipy",
    "pandas",
    "nibabel",
    "matplotlib",
    "scikit-learn",
    "scikit-image",
]

[project.optional-dependencies]
data = ["TotalSegmentator==2.18.0"]
hub = ["huggingface_hub"]

[tool.setuptools.packages.find]
include = ["sonobelief*"]

[tool.isort]
line_length = 120
known_first_party = ["sonobelief"]
force_sort_within_sections = false
